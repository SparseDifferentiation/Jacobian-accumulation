[project]
name = "jacobian-accumulation"
version = "0.1.0"
description = "Benchmarking SparseDiffEngine against AD tools for Jacobian computation"
requires-python = ">=3.11"
dependencies = [
    "casadi",
    "numpy",
    "scipy",
    "cvxpy @ git+https://github.com/Transurgeon/cvxpy.git@pr-c-resolve-caching",
    # PyPI 0.6.0 is fine for cold-extraction benchmarks; warm re-solves need a build
    # containing the composite-param_source refresh fix (SparseDiffEngine #107) --
    # see canonicalization/README.md.
    "sparsediffpy>=0.6.0",
]

[project.optional-dependencies]
jax = [
    "jax[cpu]",
]
# AMPL Solver Library comparison: Pyomo writes .nl files, PyNumero's AslNLP loads
# them through the real ASL. The compiled libpynumero_ASL is fetched separately --
# see canonicalization/README.md.
asl = [
    "pyomo",
    "packaging",  # PyNumero imports it (optional pyomo dep, required in practice)
]

